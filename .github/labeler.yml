dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - package.json
          - yarn.lock

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - src/**/*.{ts,tsx}
          - public/**/*
          - style/**/*.{css,scss}
          - lib/**/*.{ts,tsx}

config:
  - changed-files:
      - any-glob-to-any-file:
          - "*.config.js"
          - "*.config.mjs"
          - tsconfig.json
          - .prettierrc
          - .yarnrc.yml
          - .gitignore

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**/*

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - README.md
